name: accessible

# PDF/UA-2 conformance gate.
#
# All TEN document classes conform (didactic, pset, quiz, autoexam, schedule,
# syllabus, report-card, bingo, bank, thesis) -- this said "nine" from the day
# it was written, which was already wrong, and the count is the one number a
# reader uses to decide whether their class is covered. CLASS_HOME_MODULE in
# smoke_test.py is the authority; count it there rather than trusting a comment.
#
# Until this workflow existed NOTHING in CI defended conformance: tests.yml runs
# the logic suites, smoke.yml builds documents but never in accessible mode, and
# visual.yml diffs renders. It was checked only when someone remembered to run
# `python smoke_test.py --accessible` by hand. This job makes a regression a red
# check instead of a discovery months later. See ACCESSIBILITY.md for what the
# gate does and does not promise.
#
# Scope: the nine module templates + fixtures, i.e. the CLASSES. The scenario
# packs are covered locally by a11y_gallery.py, which is far too expensive for
# CI (it builds every scenario two-to-three ways and renders per-page diffs).
#
# A required check under main's branch protection (promoted 2026-08-25),
# matching visual.yml.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 7 * * *"   # nightly; offset from visual.yml's 07:00
  workflow_dispatch:

env:
  # The toolchain, by digest: texlive-full:20260701 plus the pinned
  # ImageMagick, poppler, veraPDF and pypdf, built once from
  # .github/ci-image/Dockerfile. The same line is in tests.yml, smoke.yml and
  # visual.yml; move all four together (.github/ci-image/README.md).
  CI_IMAGE: ghcr.io/landonfox00/texlib-ci:20261104-b3d4fa5@sha256:4412e258f79649c3f3e2aed1a87635959297cc870281cced384c3cf60790dc28

jobs:
  accessible:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same pinned container as visual.yml: the tagged build is lualatex-only
      # and depends on the tagging/tagpdf stack shipped with the TeX Live
      # release, so an unpinned bump could change conformance under us.
      #
      # Pin the IMAGE, not just the action. Pinning the action SHA alone left
      # `scheme: full` resolving to texlive-full:latest, and when that rolled to
      # TeX Live 2026 the newer tagpdf broke three documents (Exams,
      # examples/exam-01, Problem Sets) -- this gate was red from its first run
      # for that reason alone. `texlive_version: 2025` does NOT help: at this
      # action SHA it maps back to "latest". 20260701 is a TeX Live 2026
      # snapshot: the tagpdf 1.0c incompatibilities that kept this gate on
      # TL2025 were fixed (34/34 on both TL2025 and TL2026 -- closed issue #69,
      # 0.7.0 changelog), and the pin moved forward on 2026-08-25. Visual refs
      # are regenerated in this same container line (visual.yml's update_refs
      # dispatch), so the two gates share one toolchain.
      #
      # Every tool is IN the image (CI_IMAGE above): poppler, pypdf, and
      # veraPDF 1.30.2, hash-verified when the image was built. This job used
      # to `apk add` its packages and download veraPDF at job time; an Alpine
      # update could fail that install, and a veraPDF release cannot reach
      # this gate except through an image rebuild.
      - name: PDF/UA-2 conformance in pinned TeX Live
        uses: xu-cheng/texlive-action@f886de8159e5952a131848a5fa9c3196a2132b5d
        with:
          docker_image: ${{ env.CI_IMAGE }}
          run: |
            set -e
            # Record what actually ran: TeX Live, veraPDF, pypdf, poppler. The
            # image used to float, and nothing in the log said which TeX Live
            # produced a result -- which is what made the first failure here
            # expensive to diagnose.
            cat /etc/texlib-ci/manifest

            # veraPDF sits outside find_verapdf()'s fallback roots on purpose
            # (the Dockerfile says why): this is the one job that runs it, and
            # it does so by putting it on PATH here.
            export PATH="$TEXLIB_VERAPDF_HOME:$PATH"

            # Fail loudly if veraPDF is missing. smoke_test SOFT-SKIPS veraPDF
            # validation when the CLI is absent (the pdftotext/ImageMagick
            # convention), so without this check a broken install would turn
            # this gate into a vacuous green -- the exact trap visual.yml
            # guards against for ImageMagick.
            command -v verapdf >/dev/null 2>&1 \
              || { echo "veraPDF CLI not on PATH after install"; exit 1; }
            verapdf --version
            verapdf --version | grep -qF "1.30.2" \
              || { echo "veraPDF on PATH is not the pinned 1.30.2"; exit 1; }

            # pypdf is the OTHER soft-skip on this path, and it was missing: the
            # first runs of this gate logged "accessible/PDF-UA [pypdf MISSING ->
            # those checks skipped]" while still reporting per-module PASS. The
            # veraPDF guard above was written to stop exactly that vacuous green
            # and then left the second half of the check unguarded. pypdf
            # 6.16.2 is in the image.
            python3 -c 'import pypdf' \
              || { echo "pypdf not importable; PDF/UA checks would soft-skip"; exit 1; }

            # Tagged answer keys. The suite below builds each document's
            # default copy, and there a solution is typeset into a discarded
            # box with tagging suspended, so a defect that only a SHOWN solution
            # has cannot reach it: every part solution in a tagged key failed
            # five checks while this gate was green. This builds one exam's
            # tagged student copy and four tagged keys, and reads each key's
            # structure tree for what veraPDF does not check: that a solution
            # reads its header before its answer. It soft-skips veraPDF and
            # pypdf like the suite does, and the two guards above cover it.
            # First because it is the shorter of the two.
            python3 test_solution_tagged_conformance.py

            python3 smoke_test.py --accessible

            # The layout of a tagged {cols}. The suite above builds
            # examples/fixtures/Exams/cols-test.tex tagged, and veraPDF
            # validates its structure tree, which says nothing about where the
            # text sits: the same exam set in one column passes. This builds
            # the fixture as a normal copy and as a tagged copy and requires
            # two columns in each. It soft-skips without poppler's pdftotext,
            # and its tagged/untagged assertions without pdfinfo, so both are
            # checked for first.
            command -v pdftotext >/dev/null 2>&1 && command -v pdfinfo >/dev/null 2>&1 \
              || { echo "pdftotext or pdfinfo missing; the {cols} layout test would soft-skip"; exit 1; }
            python3 test_cols_tagged_layout.py

name: tl2026-probe

# Temporary diagnostic for issue #69 -- delete once the TL2026 tagging
# incompatibility is fixed. Deliberately runs against texlive-full:LATEST (the
# unpinned image the other four workflows were accidentally using) because the
# failures under investigation do not reproduce on the pinned TeX Live 2025.
#
# Scoped to probe/** branches: workflow_dispatch alone is unusable here, because
# GitHub only offers it for workflows already on the default branch, and this
# one deliberately never lands there.

on:
  push:
    branches: ["probe/**"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Isolate the autoexam structure violations on TL2026
        uses: xu-cheng/texlive-action@f886de8159e5952a131848a5fa9c3196a2132b5d
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:latest
          run: |
            set +e   # a fatal build is the DATA here, not a reason to stop
            apk add --no-cache python3 py3-pip poppler-utils
            pip install --no-cache-dir --break-system-packages pypdf

            REPO="$PWD"
            echo "===================== TOOLCHAIN ====================="
            tex --version | head -1
            grep -m1 -E "ProvidesExplPackage" "$(kpsewhich tagpdf.sty)" || true

            export TEXINPUTS=".:$REPO:$REPO/Exams:$REPO/Quizzes:$REPO/Notes:$REPO/Problem Sets:$REPO/Report Cards:$REPO/Schedule:$REPO/Syllabi:$REPO/Bingo:$REPO/Bank:"
            DOCMETA='\DocumentMetadata{lang=en,tagging=on,tagging-setup={math/setup={mathml-AF,mathml-SE},table/header-rows=1},pdfstandard={ua-2,a-4f}}\def\TeXLibAccessibleMode{}'

            echo "===================== VARIANT ISOLATION ====================="
            # One feature added per variant. The passing fixture has none of
            # them; the failing template has all of them.
            cd "$REPO/tests/tl2026"
            for v in v1-noparts v2-parts v3-parts-maketitle v4-multiversion \
                     v5-real-quad v5-real-ratineq v5-real-graph \
                     v6-three-problems v7-three-maketitle v8-template-shape \
                     v9-sep-none v10-sep-vmode \
                     v12-three-simple v13-three-parts-nostretch v14-three-stretch \
                     v15-three-solutions v16-three-displaymath v17-three-center \
                     v18-forced-pagebreaks \
                     v19-pair-quad-ratineq v19-pair-quad-graph v19-pair-ratineq-graph \
                     v20-parts-solution v21-math-parts v22-quad-replica; do
              rm -f "$v.log" "$v.pdf"
              lualatex -interaction=nonstopmode -shell-escape -jobname="$v" \
                "${DOCMETA}\\input{$v.tex}" >/dev/null 2>&1
              if [ -f "$v.log" ]; then
                viol=$(grep -c "Relation is not allowed" "$v.log")
                fatal=$(grep -cE "^! " "$v.log")
                pdf=$([ -f "$v.pdf" ] && echo yes || echo NO)
                # Page count, to correlate violations with page breaks: every
                # clean variant so far fits on one page, every failing one spans.
                pages=$(grep -oE "Output written on .* \([0-9]+ page" "$v.log" | grep -oE "[0-9]+ page" | grep -oE "[0-9]+" | head -1)
                echo ""
                echo "### $v : violations=$viol  errors=$fatal  pdf=$pdf  pages=${pages:-?}"
                grep -oE "Parent-Child '[^']+' --> '[^']+'" "$v.log" \
                  | sort | uniq -c | sort -rn | head -6
                grep -E "^! " "$v.log" | head -3
              else
                echo "### $v : NO LOG (build did not start)"
              fi
            done
            cd "$REPO"

            echo "===================== SMOKE (real documents) ====================="
            # FULL accessible suite now, not just the two known failures: the
            # fix has to hold for every module on TL2026, not only the ones
            # that were red.
            python3 smoke_test.py --accessible -v 2>&1 | tail -45

            echo "===================== COLLECT ====================="
            mkdir -p probe-artifacts
            cp -r .smoke_logs probe-artifacts/smoke_logs 2>/dev/null || true
            cp tests/tl2026/*.log probe-artifacts/ 2>/dev/null || true
            ls -la probe-artifacts/ 2>/dev/null || true
            exit 0

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tl2026-probe-logs
          path: probe-artifacts/
          include-hidden-files: true
          if-no-files-found: warn

name: tl2026-probe

# Temporary diagnostic for issue #69 -- delete once the TL2026 tagging
# incompatibility is fixed. Deliberately runs against texlive-full:LATEST (the
# unpinned image the other four workflows were accidentally using) because the
# failures under investigation do not reproduce on the pinned TeX Live 2025.
#
# Scoped to probe/** branches: workflow_dispatch alone is unusable here, because
# GitHub only offers it for workflows already on the default branch, and this
# one deliberately never lands there. Nothing on main or any feature branch
# triggers it.

on:
  push:
    branches: ["probe/**"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Probe the unpinned (TL2026) tagging stack
        uses: xu-cheng/texlive-action@f886de8159e5952a131848a5fa9c3196a2132b5d
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:latest
          run: |
            set +e   # a fatal build is the DATA here, not a reason to stop
            apk add --no-cache python3 py3-pip poppler-utils
            pip install --no-cache-dir --break-system-packages pypdf

            echo "===================== TOOLCHAIN ====================="
            tex --version | head -1
            echo "--- tagpdf ---"
            kpsewhich tagpdf.sty
            grep -m1 -E "ProvidesExplPackage" "$(kpsewhich tagpdf.sty)" || true
            echo "--- latex-lab block ---"
            kpsewhich latex-lab-block.ltx  || echo "(no latex-lab-block.ltx)"
            kpsewhich latex-lab-testphase-block.sty || echo "(no testphase block sty)"

            echo "===================== PROBE DOC ====================="
            cd tests
            lualatex -interaction=nonstopmode -shell-escape tl2026-probe.tex >/dev/null 2>&1
            echo "--- PROBE lines ---"
            grep -E "^PROBE:" tl2026-probe.log || echo "(no PROBE lines)"
            echo "--- errors in probe log ---"
            grep -nE "^! |Missing number|Package tagpdf Error" tl2026-probe.log | head -20 || true
            cd ..

            echo "===================== SMOKE (the 3 failures) ====================="
            python3 smoke_test.py --accessible -v Exams "Problem Sets" 2>&1 | tail -60

            echo "===================== ERROR CONTEXT (inline) ====================="
            # Printed inline as well as uploaded: the first run of this probe
            # uploaded nothing useful because upload-artifact@v4 skips
            # dot-prefixed paths by default and the logs live in .smoke_logs.
            for f in .smoke_logs/*.log; do
              [ -f "$f" ] || continue
              echo ""
              echo "######################## $f"
              grep -nE "^! " "$f" | head -5
              echo "------------------------ 45 lines before the first error:"
              awk '/^! /{ for (i = (NR>45 ? NR-45 : 1); i <= NR+12; i++) print i": "L[i]; exit } { L[NR]=$0 }' "$f"
            done

            echo "===================== COLLECT LOGS ====================="
            mkdir -p probe-artifacts
            # Copy WITHOUT the leading dot so the upload keeps it.
            cp -r .smoke_logs probe-artifacts/smoke_logs 2>/dev/null || true
            cp tests/tl2026-probe.log probe-artifacts/ 2>/dev/null || true
            ls -la probe-artifacts/ probe-artifacts/smoke_logs 2>/dev/null || true
            exit 0

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tl2026-probe-logs
          path: probe-artifacts/
          include-hidden-files: true
          if-no-files-found: warn

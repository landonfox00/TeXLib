name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast: the builder's decision logic + multi-pass orchestration, simulated.
  # No TeX toolchain needed, so this runs in seconds on every push.
  builder-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pypdf (PDF split/vmap-slicing tests)
        # Pinned to match the in-container install in biber-integration and
        # accessible.yml — one pypdf across CI.
        run: python -m pip install --quiet pypdf==6.16.2
      - name: Builder logic + orchestration tests
        run: python Sublime/test_texlib_builder.py
      - name: Build-brain smoke (native host, fake engine)
        # The only test of the oscillation stop, the filter for biblatex's own
        # rerun flags, and the TEXLIB_STATE_RERUN=0 opt-out.
        run: python Sublime/test_texlib_build.py
      - name: Thesis queue bookkeeping (blocked institutions)
        # A block that fails to load does not error -- it un-blocks the
        # institution, and the nightly profile round loops on it.
        run: python test_thesis_institutions.py
      - name: CLI host (root resolution, TEXINPUTS, TEXMF payload, modes)
        # Also the guard that the build core still imports with no Sublime
        # present: every other CLI test would keep passing if it stopped, while
        # the CLI itself became unusable outside the editor.
        run: python test_texlib_cli.py
      - name: Version contract (manifest == CHANGELOG == every Provides == plugin probe)
        # texlib-manifest.json is the machine-readable mirror of the release
        # tag. This asserts it agrees with the newest released CHANGELOG
        # heading, that every \ProvidesClass/\ProvidesPackage line carries the
        # same version (they drifted independently for 18 months before the
        # manifest existed), and that the core-file triple matches the probe
        # in Sublime/texlib/texlib.py that the installer and Doctor share.
        run: python bump_version.py --check
      - name: Native runner (fake Popen; async driver + post-build delegation)
        run: python Sublime/test_texlib_runner.py
      - name: Derived TEXINPUTS default (how builds find the classes)
        # Unset `texinputs` used to mean "inherit the environment", which for
        # Sublime meant nothing -- so every document failed at \documentclass
        # unless the standalone installer had written the setting. It is derived
        # from the package location now, and that resolution is a real
        # filesystem walk keyed off __file__, so it is worth a real test.
        run: python Sublime/test_texlib_texinputs.py
      - name: TeXaM app + bank-plugin tests (headless, no toolchain)
        run: |
          set -e
          python test_texam.py
          python test_texam_server.py
          python Sublime/test_texlib_texam.py
          python Sublime/test_texlib_bank.py
          python Sublime/test_texlib_domain.py
      - name: Build-mode parity (picker, build file, palette, brain)
        # A mode is declared in four files that nothing else ties together.
        # `accessible` shipped in the build file alone, so Ctrl+Shift+B never
        # listed it and a direct dispatch was rejected as an unknown mode.
        run: python Sublime/test_texlib_modes.py
      - name: Plugin command modules (headless, sublime stubbed)
        # One file per plugin module, imported behind stub sublime and
        # sublime_plugin modules. Seven of the eight modules are imported by no
        # other test, so one that stops importing headless shows only here.
        run: |
          set -e
          python Sublime/test_texlib_complete.py
          python Sublime/test_texlib_doctor.py
          python Sublime/test_texlib_editor.py
          python Sublime/test_texlib_gallery.py
          python Sublime/test_texlib_locate.py
          python Sublime/test_texlib_scaffold.py
          python Sublime/test_texlib_texmf.py
          python Sublime/test_texlib_tools.py
      - name: Course tools (bank report, key collation, coursemeta lint, version diff)
        # test_collate_keys.py merges real PDFs with pypdf and skips that check
        # when pypdf is missing, so it depends on the install step above.
        run: |
          set -e
          python test_bank_report.py
          python test_collate_keys.py
          python test_coursemeta_lint.py
          python test_version_diff.py

  # TeXaM client-side pure logic (texam_web/logic.js) under Node's built-in test
  # runner -- no npm dependencies. Covers the browser-only helpers with no server
  # equivalent (HTML escaping, SVG id-namespacing, filter matching, points math,
  # exam-body serialization). Node isn't needed to *use* TeXaM; only to run these.
  js-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `node --test` from the dir globs *.test.js -- stable across node 20..24
      # (the bare-directory-path form changed behavior in node 24) and auto-picks
      # up new test files.
      - name: TeXaM client pure-logic tests
        working-directory: texam_web/test
        run: node --test

  # Pure-Lua unit tests for the class-local Lua engines. No TeX toolchain — a
  # stock lua 5.3 runs them (the engines are tex-independent; the tests stub the
  # tex.* globals) — so this stays in the fast, no-container lane.
  #   test_shuffle.lua           -- problem_shuffle.lua permutation contract
  #   Bingo/test_bingo.lua       -- bingo card generator (25 cells, free, distinct)
  #   Report Cards/test_report_card.lua -- gradebook CSV -> \rcRenderStudent mapping
  lua-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.3
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Pure-Lua unit tests
        run: |
          set -e
          lua5.3 test_shuffle.lua
          lua5.3 Bingo/test_bingo.lua
          lua5.3 "Report Cards/test_report_card.lua"

  # Advisory chktex lint (N4). chktex was editor-side/manual; this
  # surfaces it in CI without blocking. It lints the module TEMPLATES + the
  # example course (document-level LaTeX, what chktex is for -- not the .cls/.sty
  # package code) with the repo chktexrc. -n1 quiets the intentional
  # space-terminated section macros; the step never fails the build (|| true), so
  # the report is visible in the logs as guidance, not a gate.
  chktex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install chktex
        run: sudo apt-get update && sudo apt-get install -y chktex
      - name: Lint templates + example docs (advisory)
        run: |
          mapfile -t files < <(find . \( -name '*-template.tex' \
            -o -path './examples/*/*.tex' \) -not -path './.git/*')
          echo "chktex: linting ${#files[@]} document(s) with chktexrc"
          chktex -q -n1 -l chktexrc "${files[@]}" || true

  # Real end-to-end: drives the actual builder coroutines against a genuine
  # toolchain. Proofs run here:
  #   * test_biber_integration.py    -- pdflatex + biber on a biblatex fixture,
  #     proving the biber-skip cache and rerun handling.
  #   * test_shuffle_integration.py -- drives a real lualatex build of a
  #     3-version exam and reads the PDF back to assert the autoexam shuffle
  #     GUARANTEES at the rendered-PDF level (same set per version, points
  #     travel, extra credit last, sections unmixed, student order == solutions
  #     order). Needs poppler's pdftotext (-bbox) + pdftoppm.
  #   * test_synctex_integration.py -- drives a real lualatex build then asks
  #     TeX Live's own `synctex edit` CLI to resolve a PDF-space point back to
  #     a source file + line, exactly what SumatraPDF does before an inverse
  #     search jump. Needs poppler's pdftotext (-bbox support -- NOT any
  #     xpdf-flavored build) in addition to the toolchain the other two use.
  #   * test_engine_correctness.py  -- real lualatex build of committed bank
  #     fixtures, reading the PDF back with pdftotext to prove the problem
  #     engine renders the RIGHT substituted values, \calcvar results, and MC
  #     answer letters (the "wrong number / wrong key" silent-failure class).
  #   * test_exam_seed.lua          -- pure-texlua unit test of set_exam_seed's
  #     per-version decorrelation (needs texlua, hence this job, not the fast
  #     Python-only one). Cheap; run first.
  #   * test_shuffle.lua -- the permutation core (problem_shuffle.lua) under
  #     texlua alone: bijection, determinism, seed-sensitivity, extra-credit
  #     pinning. Pure logic, but texlua ships only with TeX Live, so it rides
  #     this job rather than the toolchain-free builder-logic one above. A
  #     deliberately broken permutation fails CI here on every push (smoke.yml /
  #     visual.yml are main-only, so this is the shuffle core's only feature-
  #     branch gate).
  #   * test_mode_effects.py -- differential leakage guard: builds one exam
  #     fixture per assessment flag and asserts each flag CHANGES output (a
  #     solution/answer/rubric never leaks into a student copy, and the answer
  #     key is not a silent no-op). Needs lualatex + poppler's pdftotext.
  #   * test_schedule_schedmeta.lua -- the <jobname>.schedmeta sidecar, under
  #     texlua with tex.* stubbed. Its entry ids carry no date: cancelling a
  #     class day moves the exam and changes no content id. Rides this job for
  #     the reason test_shuffle.lua does; its two Schedule siblings run in
  #     smoke.yml, which is main-only.
  #   * test_engine_emit_edges.py -- real lualatex builds read back with
  #     pdftotext: the engine-emitted .vmap against the pages it names, then
  #     through the builder's own slicer (pypdf); the "N of M" footer,
  #     unresolved after one pass and resolved after two; \ppart parts
  #     contiguous under \shuffle; an \importproblem stem.
  # All soft-skip if their tools are missing, so a toolchain hiccup degrades
  # gracefully rather than failing the job.
  #
  # Runs in the SAME pinned full-scheme TeX Live container as smoke.yml /
  # visual.yml (full bundles biber + lualatex + the class deps: tikz/pgfplots,
  # lmodern, mathtools), so the whole CI shares one stable toolchain. pypdf
  # (the real check's PDF assertions) is pip-installed in the container.
  biber-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # As in the other three workflows, the action SHA pins the action and not
      # the toolchain; `scheme: full` tracked texlive-full:latest. 20260701 is
      # TeX Live 2026. poppler-utils and pypdf are version-pinned as well —
      # the image pin does not freeze apk or pip, which resolve live.
      - name: Real biber + SyncTeX + shuffle + mode-effect tests in pinned TeX Live
        uses: xu-cheng/texlive-action@f886de8159e5952a131848a5fa9c3196a2132b5d
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20260701
          run: |
            set -e
            apk add --no-cache python3 py3-pip poppler-utils=25.12.0-r1
            pip install --break-system-packages --quiet pypdf==6.16.2 \
              || pip install --quiet pypdf==6.16.2
            texlua test_exam_seed.lua
            python3 Sublime/test_biber_integration.py
            python3 Sublime/test_shuffle_integration.py
            python3 Sublime/test_synctex_integration.py
            python3 test_engine_correctness.py
            # Shuffle permutation core -- texlua only, no build (see comment above).
            texlua test_shuffle.lua
            # Assessment build-flag leakage guard (solutions/answers/rubric).
            python3 test_mode_effects.py
            # course-metadata.sty's directory-walk depth + class-option-over-
            # coursemeta precedence (real pdflatex builds + pdftotext).
            python3 test_metadata_resolution.py
            # bank.cls \printbankcatalog render check (part labels, solutions).
            python3 test_bank_catalog.py
            # Theorem taxonomy + aliases + shared counter (C1) and solution
            # header (C2) render checks.
            python3 test_class_render.py
            # MC answer-key marks the correct choice + schedule grid content.
            python3 test_mc_schedule_render.py
            # Schedule .schedmeta sidecar: entry ids stay put when the dates
            # shift. texlua only, no build.
            texlua Schedule/test_schedule_schedmeta.lua
            # Engine-emitted .vmap against the rendered PDF and the builder's
            # slicer, the two-pass "N of M" footer, \ppart under \shuffle.
            python3 Sublime/test_engine_emit_edges.py
            # TeXaM real-render integration: lualatex + pdftocairo on the demo
            # bank (the composer preview pipeline). LUAINPUTS points at the repo
            # root so the class-local .lua engines resolve in the container
            # (bank_render sets TEXINPUTS itself; there is no _texlibjunc here).
            export LUAINPUTS=".:$(pwd)//:"
            python3 test_texam_render.py

name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # N5: run the full smoke on a feature branch on demand (Actions -> smoke -> Run
  # workflow -> pick the branch). Optionally smoke only a subset of modules.
  workflow_dispatch:
    inputs:
      modules:
        description: "Space-separated module subset to smoke (blank = all)"
        required: false
        default: ""

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run smoke tests in TeX Live container
        # Pinned (the commit v2 resolved to) so the build environment — and thus
        # the visual.yml reference rendering it shares — stays stable over time.
        # The action SHA alone does NOT pin the toolchain: `scheme: full` used to
        # resolve to texlive-full:latest, so TeX Live rolled underneath all four
        # workflows. Pin the image itself; 20260701 is TeX Live 2026. The apk
        # package below is version-pinned too — the image pin does not freeze
        # apk, which resolves against Alpine's live v3.24 index.
        uses: xu-cheng/texlive-action@f886de8159e5952a131848a5fa9c3196a2132b5d
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20260701
          # poppler-utils provides pdftotext for the content checks (substring
          # assertions + non-empty artifact checks) and for the text-layer
          # round trip. Visual regression is a local-only aid
          # (environment-specific reference images), so ImageMagick is
          # intentionally not installed here.
          run: |
            set -e
            apk add --no-cache python3 poppler-utils=25.12.0-r1
            texlua Schedule/test_schedule_synctex.lua
            texlua Schedule/test_schedule_quiz_exam.lua
            python3 Sublime/test_texlib_builder.py
            # Text-layer fidelity: what a document sets is what the PDF says.
            # Runs BEFORE the module suite because it is fast, needs no
            # fixtures, and its failure mode (silent character corruption)
            # is one the module suite cannot see. Both engines are exercised,
            # so it also guards the pdfTeX half of the corepkg font
            # conditional, which is not otherwise covered here.
            python3 test_text_layer.py
            python3 smoke_test.py -v ${{ github.event.inputs.modules }}

      - name: Upload failed-build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tex-logs
          path: |
            **/*.log
          retention-days: 7

name: visual

# Visual-regression gate. The reference images in tests/visual_refs/ are
# environment-specific (font rendering differs across TeX Live builds), so this
# job pins the SAME TeX Live container the refs were generated in and diffs
# freshly rendered pages against them. A required check under main's branch
# protection (promoted 2026-08-25).
#
# Regenerating the refs: run this workflow manually
# (Actions > visual > Run workflow) with "update_refs" = true. It rebuilds the
# refs inside the pinned container and uploads them as the "visual-refs"
# artifact; download it and commit tests/visual_refs/ so a later check matches.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"   # nightly safety net (default branch only)
  workflow_dispatch:
    inputs:
      update_refs:
        description: "Regenerate + upload reference images instead of checking"
        type: boolean
        default: false

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the commit v2 resolved to, so rendering stays byte-stable over
      # time (a silent TeX Live bump would otherwise invalidate every ref).
      # That silent bump DID happen: the action SHA pinned only the action, while
      # `scheme: full` tracked texlive-full:latest. Pinning the image does NOT
      # pin the apk packages either: `apk add` resolves against Alpine's LIVE
      # v3.24 index, which is how ImageMagick rolled to the 7.1.2.27 Beta under
      # a pinned image on 2026-07-29 and cost this gate its fuzz tolerance. The
      # outcome-deciding apk packages are therefore version-pinned below; when
      # Alpine drops a pinned version this fails loudly at `apk add`, and the
      # bump (plus a ref regen if rendering shifts) happens deliberately.
      #
      # That is not hypothetical: Alpine dropped 7.1.2.27-r0 and this gate went
      # red on every PR with "unable to select packages: imagemagick-7.1.2.30-r0
      # breaks world[imagemagick=7.1.2.27-r0]" -- the pin failing loudly, as
      # designed, but at `apk add` rather than at a diff, so the job never
      # reaches a render. Two things to know when it happens again: the failure
      # looks nothing like a visual regression (~1m20s, no image comparison in
      # the log), and an `update_refs` dispatch dies the same way BEFORE
      # regenerating, so its artifact is the plain checkout -- check
      # .regen-manifest before committing anything from it. Bumped to
      # 7.1.2.30-r0 on 2026-08-30.
      # 20260701 is TeX Live 2026; the refs are regenerated in this same
      # container (update_refs dispatch), so refs and checks share a toolchain.
      - name: Visual regression in pinned TeX Live
        uses: xu-cheng/texlive-action@f886de8159e5952a131848a5fa9c3196a2132b5d
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20260701
          # poppler-utils -> pdftoppm (PDF->PNG); imagemagick -> magick compare.
          run: |
            set -e
            apk add --no-cache python3 poppler-utils=25.12.0-r1 imagemagick=7.1.2.30-r0
            # Fail loudly if the compare tool is missing: smoke_test soft-skips
            # visual checks when ImageMagick is absent, which would make this
            # gate pass vacuously.
            command -v magick >/dev/null 2>&1 || command -v compare >/dev/null 2>&1 \
              || { echo "ImageMagick (magick/compare) not available"; exit 1; }
            # Record what actually ran (the accessible.yml convention): a diff
            # dispute starts with knowing which renderer + differ produced it.
            # No `cmd | head` here: the action shell runs with pipefail, and a
            # writer that outlives head's early close dies of SIGPIPE (141) --
            # that exact race killed this step's first run under 20260701.
            magick --version > /tmp/magick-version.txt 2>&1 || true
            head -1 /tmp/magick-version.txt
            pdftoppm -v > /tmp/pdftoppm-version.txt 2>&1 || true
            head -1 /tmp/pdftoppm-version.txt
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
               && [ "${{ github.event.inputs.update_refs }}" = "true" ]; then
              echo "Regenerating reference images..."
              # The artifact below uploads on always() -- a failing later phase
              # must not withhold refs an earlier phase regenerated. The cost
              # of that choice: a run that dies BEFORE regenerating uploads the
              # plain checkout, byte-identical to "no rendering change". This
              # manifest is the tell. Absent = nothing was regenerated; each
              # phase appends its line only after it completes. Read it before
              # trusting the artifact. Gitignored: it describes one CI run,
              # never a commit.
              {
                echo "run_id=${{ github.run_id }}"
                echo "image=ghcr.io/xu-cheng/texlive-full:20260701"
                head -1 /tmp/magick-version.txt
                head -1 /tmp/pdftoppm-version.txt
              } > tests/visual_refs/.regen-manifest
              python3 smoke_test.py --update-refs
              echo "modules=regenerated" >> tests/visual_refs/.regen-manifest
              python3 smoke_test.py --scenarios --update-refs
              echo "scenarios=regenerated" >> tests/visual_refs/.regen-manifest
            else
              echo "Checking against committed reference images..."
              python3 smoke_test.py --visual
              python3 smoke_test.py --scenarios
            fi

      - name: Upload regenerated refs
        # always(): a failing check step (e.g. one scenario's content assertion)
        # must not deny you the refs that were regenerated before it.
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.update_refs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-refs
          path: tests/visual_refs/
          retention-days: 7
